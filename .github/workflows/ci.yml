name: StellarRise Midnight CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Compact & Run ZK Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Compact Smart Contract
        run: npm run compile:compact

      - name: Run Midnight Smart Contract & Privacy Tests
        run: npm test

      - name: Build Frontend Application
        run: npm run build
